# Prometheus 配置 - 供 SuperBizAgent 监控工具层 (app/services/monitoring/) 使用
# 启动: docker run -d --name super-biz-prometheus --network host \
#         -v $(pwd)/deploy/prometheus.yml:/etc/prometheus/prometheus.yml \
#         prom/prometheus:v2.28.1 --config.file=/etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["localhost:9100"]
